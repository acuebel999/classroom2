<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Words</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8e7;--card:#fff;--ink:#2b2d42;--accent:#ff7a59;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--line:#ffd89b}
:root[data-theme="light"]{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2233;--card:#2c3047;--ink:#fff;--line:#4a4f73}}
:root[data-theme="dark"]{--bg:#1f2233;--card:#2c3047;--ink:#fff;--line:#4a4f73}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#logo{width:84px;height:84px;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px;flex:none}
#logo img{width:100%;height:100%;object-fit:contain}
h1{font-size:28px;margin:0;line-height:1}
.small{font-size:12px;opacity:.7;cursor:pointer;text-decoration:underline}
.menu{display:grid;gap:12px;margin-top:12px}
.big{font:inherit;font-size:22px;font-weight:700;color:#fff;border:0;border-radius:20px;padding:18px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);text-align:left}
.big span{font-size:34px;margin-right:10px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.back{font:inherit;font-size:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 12px;cursor:pointer}
.say{font:inherit;font-size:46px;border:0;background:var(--blue);border-radius:50%;width:84px;height:84px;cursor:pointer;display:block;margin:6px auto 12px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{font:inherit;color:var(--ink);background:var(--card);border:4px solid var(--line);border-radius:22px;padding:8px;cursor:pointer;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.art{font-size:74px;line-height:1;width:100%;display:flex;align-items:center;justify-content:center}
.art svg{width:80px;height:80px}
.card.ok{border-color:var(--green);background:#dcfce7;color:#14532d}
.card.no{border-color:var(--red);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{text-align:center;font-size:26px;min-height:36px;font-weight:700}
.stage{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:8px auto;background:var(--card);border:4px solid var(--line);border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage .art{font-size:150px}.stage .art svg{width:60%;height:60%}
.cover{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.cover i{background:var(--accent);border:1px solid rgba(255,255,255,.5);transition:opacity .4s}
.cover i.gone{opacity:0}
.words{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin-top:8px}
.words .card{aspect-ratio:auto;padding:14px 4px;font-size:22px}
.seq{display:flex;gap:6px;justify-content:center;margin:10px 0}
.seq .card{aspect-ratio:1;width:19%;padding:2px;cursor:default;font-size:11px;border-radius:14px}
.seq .art{font-size:36px}.seq .art svg{width:36px;height:36px}
.seq .q{font-size:36px;color:var(--accent)}
.seq .card.hid{opacity:.12}
.end{text-align:center;font-size:30px;margin-top:20px}
.end .stars{font-size:48px;letter-spacing:4px}
</style>
</head>

 if(voice)u.voice=voice;u.lang='en-GB';u.rate=.8;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.getVoices()}catch(e){}

/* menu */
function menu(){clearT();speechSynthesis&&speechSynthesis.cancel();
 app.innerHTML=`<div class="menu">
 <button class="big" style="background:#3b82f6" data-g="listen"><span>👂</span>Listen &amp; touch</button>
 <button class="big" style="background:#ff7a59" data-g="reveal"><span>🔍</span>What is it?</button>
 <button class="big" style="background:#a855f7" data-g="next"><span>🔁</span>What comes next?</button>
 <button class="big" style="background:#22c55e" data-g="learn"><span>📖</span>Learn the words</button></div>`;
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>GAMES[b.dataset.g]())}
const TOP=(extra='')=>`<div class="top"><button class="back" id="bk">⬅ Menu</button><div id="sc">${extra}</div></div>`;
const bind=()=>{$('#bk').onclick=menu};

/* shared round engine */
function run(build){clearT();let n=0,score=0;const TOTAL=5;
 const next=()=>{clearT();if(n>=TOTAL){return end(score,TOTAL)}n++;
  let locked=false,wrong=false;
  const answer=(ok,el,word)=>{if(locked)return;
   if(ok){locked=true;if(!wrong)score++;el&&el.classList.add('ok');$('.msg').textContent='⭐ Great!';speak(word);later(next,1800)}
   else{wrong=true;el&&el.classList.add('no');$('.msg').textContent='Try again 💪';later(()=>el&&el.classList.remove('no'),400)}};
  build(answer,TOTAL,n)};
 next()}
function end(score){app.innerHTML=TOP()+`<div class="end"><div class="stars">${'⭐'.repeat(score)}${'☆'.repeat(5-score)}</div><p>${score} / 5</p>
 <button class="big" style="background:#ff7a59" id="again">Play again 🔄</button></div>`;bind();
 speak(score>=4?'Fantastic!':'Good job!');$('#again').onclick=()=>GAMES.last()}

const GAMES={last:()=>{},
/* 1 */ listen(){GAMES.last=GAMES.listen;run((answer,T,n)=>{
 const t=shuf(ITEMS)[0],opts=shuf([t,...others(t,3)]);
 app.innerHTML=TOP(`${n}/${T}`)+`<button class="say" id="sp">🔊</button><div class="msg">Touch it!</div><div class="grid">${opts.map((o,i)=>`<button class="card" data-i="${i}">${art(o)}</button>`).join('')}</div>`;
 bind();$('#sp').onclick=()=>speak(t.w);later(()=>speak(t.w),400);
 app.querySelectorAll('.card').forEach(c=>c.onclick=()=>answer(opts[c.dataset.i]===t,c,t.w))})},
/* 2 */ reveal(){GAMES.last=GAMES.reveal;run((answer,T,n)=>{
 const t=shuf(ITEMS)[0],opts=shuf([t,...others(t,2)]);
 app.innerHTML=TOP(`${n}/${T}`)+`<div class="stage">${art(t)}<div class="cover">${'<i></i>'.repeat(16)}</div></div><div class="msg">What is it?</div>
 <div class="words">${opts.map((o,i)=>`<button class="card" data-i="${i}">${o.w}</button>`).join('')}</div>`;
 bind();const tiles=shuf([...app.querySelectorAll('.cover i')]);
 const iv=setInterval(()=>{const x=tiles.pop();if(x)x.classList.add('gone');else clearInterval(iv)},900);timers.push(iv);
 app.querySelectorAll('.words .card').forEach(c=>{c.onclick=()=>{const ok=opts[c.dataset.i]===t;speak(opts[c.dataset.i].w);
  if(ok){clearInterval(iv);app.querySelectorAll('.cover i').forEach(x=>x.classList.add('gone'))}
  answer(ok,c,t.w);if(ok)later(()=>speak(t.w),600)}})})},
/* 3 */ next(){GAMES.last=GAMES.next;run((answer,T,n)=>{
 const [a,b,c]=shuf(ITEMS).slice(0,3),seq=[a,b,c,a,b],opts=shuf([c,...others(c,2).filter(x=>x!==a&&x!==b)]).slice(0,3);
 while(opts.length<3){const x=shuf(ITEMS)[0];if(!opts.includes(x)&&x!==c)opts.push(x)}
 const mix=shuf(opts);
 app.innerHTML=TOP(`${n}/${T}`)+`<div class="msg">Look and listen 👀</div><div class="seq">${seq.map(()=>'<div class="card hid"></div>').join('')}<div class="card"><div class="art q">?</div></div></div>
 <div class="words" id="ch" style="visibility:hidden">${mix.map((o,i)=>`<button class="card" data-i="${i}">${art(o)}</button>`).join('')}</div>`;
 bind();const slots=app.querySelectorAll('.seq .card');
 seq.forEach((it,i)=>later(()=>{slots[i].classList.remove('hid');slots[i].innerHTML=art(it)+it.w;speak(it.w)},600+i*1700));
 later(()=>{$('.msg').textContent='What comes next? 🤔';$('#ch').style.visibility='visible'},600+5*1700);
 app.querySelectorAll('#ch .card').forEach(cd=>cd.onclick=()=>{const o=mix[cd.dataset.i];
  if(o===c)later(()=>{slots[5].innerHTML=art(c)+c.w},0);answer(o===c,cd,c.w)})})},
/* 4 */ learn(){clearT();app.innerHTML=TOP()+`<div class="msg">Touch to listen 👆</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${ITEMS.map((o,i)=>`<button class="card" style="font-size:15px" data-i="${i}">${art(o)}${o.w}</button>`).join('')}</div>`;
 bind();app.querySelectorAll('.card').forEach(c=>c.onclick=()=>speak(ITEMS[c.dataset.i].w))}};
menu();
</script>
</body>
</html>
